name: banystock-prod

services:
  proxy:
    image: caddy:2-alpine
    container_name: banystock-prod-proxy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - banystock-prod-net

  app:
    image: yash1115/banystock:latest
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      OCTANE_SERVER: frankenphp
      FRANKENPHP_WORKERS: "${FRANKENPHP_WORKERS:-4}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./.env:/var/www/html/.env:ro
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - banystock-prod-net

  queue:
    image: yash1115/banystock:latest
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./.env:/var/www/html/.env:ro
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "redis", "--tries=3", "--max-time=3600", "--sleep=3"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${QUEUE_REPLICAS:-1}
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    networks:
      - banystock-prod-net

  # One-off migration job. Never starts with `docker compose up` (profile-gated).
  # Run explicitly before scaling app up, e.g. after a deploy:
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  migrate:
    image: yash1115/banystock:latest
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
    entrypoint: ["php", "artisan"]
    command: ["migrate", "--force"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - banystock-prod-net

  mysql:
    image: mariadb:10.11
    container_name: banystock-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - banystock-prod-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - banystock-prod-net

  redis:
    image: redis:alpine
    container_name: banystock-prod-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    volumes:
      - banystock-prod-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - banystock-prod-net

networks:
  banystock-prod-net:
    driver: bridge

volumes:
  banystock-prod-mysql-data:
    driver: local
  banystock-prod-redis-data:
    driver: local
  caddy-data:
    driver: local
