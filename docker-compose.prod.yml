name: banystock-prod

services:
  app:
    image: yash1115/banystock:latest
    container_name: banystock-prod-app
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-80}:80"
      - "443:443"
    environment:
      APP_NAME: "${APP_NAME:-Banystock}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      FRANKENPHP_WORKERS: 4
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-banystock}"
      DB_USERNAME: "${DB_USERNAME:-banystock_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-secret}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      ANGELONE_CLIENT_CODE: "${ANGELONE_CLIENT_CODE}"
      ANGELONE_PASSWORD: "${ANGELONE_PASSWORD}"
      ANGELONE_TOTP_SECRET: "${ANGELONE_TOTP_SECRET:-}"
      ANGELONE_TOTP: "${ANGELONE_TOTP:-}"
      ANGELONE_API_KEY: "${ANGELONE_API_KEY}"
    volumes:
      - ./.env:/var/www/html/.env
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - banystock-prod-net

  mysql:
    image: mariadb:10.11
    container_name: banystock-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - banystock-prod-mysql-data:/var/lib/mysql
    networks:
      - banystock-prod-net

  redis:
    image: redis:alpine
    container_name: banystock-prod-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-secret}"
    volumes:
      - banystock-prod-redis-data:/data
    networks:
      - banystock-prod-net

networks:
  banystock-prod-net:
    driver: bridge

volumes:
  banystock-prod-mysql-data:
    driver: local
  banystock-prod-redis-data:
    driver: local
